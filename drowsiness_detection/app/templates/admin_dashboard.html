<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_dashboard.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('main.detection') }}">Detection</a>
        <div class="spacer"></div>
        <a href="{{ url_for('main.login') }}">Login</a>
        <a href="{{ url_for('main.signup') }}">Signup</a>
        <form method="POST" action="{{ url_for('main.logout') }}" style="display:inline;">
            <button type="submit">Logout</button>
        </form>
    </nav>
    
    <div class="container">
        <h1>Admin Dashboard</h1>
        <p>Total Users: {{ total_users }}</p>
        <table>
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Email</th>
                    <th>Hashed Password</th>
                    <th>Last Login</th>
                    <th>Last Logout</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                    <tr>
                        <td>{{ user.id }}</td>
                        <td>{{ user.email }}</td>
                        <td>{{ user.password }}</td>
                        <td>{{ user.last_login or "Never" }}</td>
                        <td>{{ user.last_logout or "Never" }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
